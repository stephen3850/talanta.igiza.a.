  <ellipse cx="96" cy="100" rx="24" ry="14" stroke="#10B981" stroke-width="3" fill="#060B1E" />
  <circle cx="96" cy="100" r="5" fill="url(#accent)" />

  <!-- Lettering T -->
  <text x="96" y="132" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="18" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">TALANTA</text>
</svg>
