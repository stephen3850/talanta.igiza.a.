  </defs>

  <!-- Background rounded box -->
  <rect width="192" height="192" rx="40" fill="url(#bg)" stroke="#10B981" stroke-width="4" />

  <!-- Shield Shape -->
  <path d="M96 28 L148 50 V94 C148 128 124 156 96 166 C68 156 44 128 44 94 V50 Z" fill="url(#shield)" opacity="0.15" />
  <path d="M96 36 L140 55 V92 C140 122 120 146 96 155 C72 146 52 122 52 92 V55 Z" stroke="url(#shield)" stroke-width="5" fill="none" stroke-linejoin="round" />

  <!-- Stadium Arc / Crown -->
