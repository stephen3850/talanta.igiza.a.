<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060B1E" />
      <stop offset="100%" stop-color="#0B132B" />
    </linearGradient>
    <linearGradient id="shieldMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="accentMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Full square background for maskable icon safe zone -->
  <rect width="512" height="512" fill="url(#bgMask)" />

  <!-- Shield Shape inside safe zone (400x400 safe area) -->
  <path d="M256 100 L370 150 V245 C370 320 318 382 256 404 C194 382 142 320 142 245 V150 Z" stroke="url(#shieldMask)" stroke-width="12" fill="none" stroke-linejoin="round" />

  <!-- Stadium Arc / Crown -->
  <path d="M205 215 C236 195 276 195 307 215" stroke="url(#accentMask)" stroke-width="10" stroke-linecap="round" fill="none" />
  <ellipse cx="256" cy="260" rx="52" ry="30" stroke="#10B981" stroke-width="8" fill="#060B1E" />
  <circle cx="256" cy="260" r="12" fill="url(#accentMask)" />

  <text x="256" y="335" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="36" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">TALANTA</text>
</svg>
